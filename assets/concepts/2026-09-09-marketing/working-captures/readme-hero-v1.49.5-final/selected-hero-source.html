<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviary social preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #090e15; color: #f1f5fa; font-family: Arial, sans-serif; }
  main { position: relative; width: 1200px; height: 630px; padding: 65px 74px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 23px; }
  img { display: block; width: 92px; height: 92px; }
  .name { font-size: 62px; font-weight: 750; letter-spacing: -2.5px; }
  .category { margin-left: auto; color: #9faebb; text-align: right; font-size: 18px; line-height: 1.7; }
  h1 { margin: 67px 0 20px; font-size: 67px; font-weight: 700; letter-spacing: -3px; line-height: 1.08; }
  h1 span { color: #5fdbd4; }
  p { margin: 0; color: #b3c0ce; font-size: 25px; line-height: 1.5; }
  footer { display: flex; align-items: center; justify-content: space-between; position: absolute; bottom: 59px; left: 74px; right: 74px; border-top: 1px solid #29333f; padding-top: 24px; color: #b3c0ce; font-size: 16px; }
  .features { display: flex; gap: 30px; }
  .url { color: #edf4fa; }
</style>
<main aria-label="Aviary product preview">
  <header>
    <img src="../../src/extension/icons/icon-128.png" alt="Aviary bird icon">
    <div class="name">Aviary</div>
    <div class="category">OPEN SOURCE<br>FOR X / TWITTER</div>
  </header>
  <h1>A quieter X.<br><span>Keep what matters.</span></h1>
  <p>Media downloads and a local library, right in your browser.</p>
  <footer>
    <div class="features"><span>Reading controls</span><span>Media downloads</span><span>Local archives</span></div>
    <span class="url">github.com/SysAdminDoc/Aviary</span>
  </footer>
</main>
</html>
