name: Playwright smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tests/release-matrix.test.mjs"
      - "tests/smoke/**"
      - "tools/build.mjs"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static analysis
        run: npm run lint

      - name: Run deterministic release matrix
        run: npm run test:matrix

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and Mozilla Firefox
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O /tmp/mozilla.asc
          test "$(gpg --show-keys --with-colons /tmp/mozilla.asc | awk -F: '$1 == "fpr" { print $10; exit }')" = "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3"
          sudo mv /tmp/mozilla.asc /etc/apt/keyrings/packages.mozilla.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Build extension
        run: npm run build

      - name: Run isolated cross-browser smoke tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run smoke
