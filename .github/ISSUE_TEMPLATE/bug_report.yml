name: Bug report
description: Something Aviary does on X is wrong, or stopped working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        X changes its markup frequently, so a broken feature is usually a selector that no longer
        matches. The Control Center's **Trust** section reports selector health and saved warnings.
        **Copy diagnostics** there gathers everything below except the description.

        If you do not know which feature is at fault, run **Trust → Find the feature breaking this
        page** first. It turns Aviary's features off and on in halves and names the one responsible
        in about five rounds, without changing any of your settings.

        Please do not paste post text, handles, URLs, cookies, or tokens. Aviary's diagnostics
        deliberately contain none of those, and an issue does not need them either.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Which X surface — Home, a conversation, a profile, Notifications, Messages, Search.
      placeholder: Home timeline
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Userscript
        - Chrome / Edge / Brave extension
        - Firefox extension
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aviary version
      description: Shown in the Control Center header and in the userscript metadata.
      placeholder: 1.22.0
    validations:
      required: true
  - type: input
    id: bisect
    attributes:
      label: Feature search result
      description: >-
        Trust -> "Find the feature breaking this page" turns Aviary's features off in halves and
        names the one responsible. Paste the sentence it ends on, or leave blank if you did not run it.
      placeholder: "media.buttons is what changed this page"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of Trust → Copy diagnostics. Content-free by design; check before pasting.
      render: json
  - type: textarea
    id: selector-report
    attributes:
      label: Selector break report
      description: If Trust shows a degraded selector, paste Trust → Copy diagnostics from that row. It contains only the build, route surface, missing surfaces, and feature IDs.
      render: text
  - type: checkboxes
    id: isolated
    attributes:
      label: Isolation
      options:
        - label: I checked whether the problem persists with Aviary's settings reset to defaults.
        - label: I checked whether another extension or userscript also touches X.
